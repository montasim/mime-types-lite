name: CI

on:
    push:
        branches:
            - main
            - v2
    pull_request:

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest
        strategy:
            matrix:
        node-version: [20, 22, 24]

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Verify
              run: npm run check

            - name: Inspect package contents
              run: npm pack --dry-run
